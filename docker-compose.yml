version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost only — reached through the app's DATABASE_URL, not
      # meant to be open on the network. Change (and add a firewall rule) only
      # if a remote client genuinely needs direct access.
      - "127.0.0.1:5432:5432"

  valkey:
    image: valkey/valkey:7
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}"]
    ports:
      # Bound to localhost only, same reasoning as postgres above.
      - "127.0.0.1:6379:6379"
